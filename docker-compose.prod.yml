services:
  mongodb:
    image: mongo:7.0
    container_name: pos_prod_mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-pos_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-pos_secure_password}
      MONGO_INITDB_DATABASE: restaurant_pos
    volumes:
      - mongo_prod_data:/data/db

  redis:
    image: redis:7.2-alpine
    container_name: pos_prod_redis
    restart: always
    volumes:
      - redis_prod_data:/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: pos_prod_api
    restart: always
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      MONGODB_URI: mongodb://${MONGO_ROOT_USER:-pos_admin}:${MONGO_ROOT_PASSWORD:-pos_secure_password}@mongodb:27017/restaurant_pos?authSource=admin
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-super_production_secret_change_me_in_env}
    depends_on:
      - mongodb
      - redis

volumes:
  mongo_prod_data:
  redis_prod_data:
